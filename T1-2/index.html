<!DOCTYPE html>
<html>

<head>
   <title>Basic Scene</title>

   <link rel="shortcut icon" href="../favicon.ico">
   <link rel="stylesheet" href="../html/resources/default.css">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <style>
      /* Estilos Básicos */
      #loading-screen {
         position: absolute;
         width: 100%;
         height: 100%;
         background: #000;
         color: #fff;
         display: flex;
         flex-direction: column;
         justify-content: center;
         align-items: center;
         z-index: 9999;
      }

      #countdown {
         position: absolute;
         top: 40%;
         left: 50%;
         transform: translate(-50%, -50%);
         font-size: 120px;
         font-weight: bold;
         color: #ffeb3b;
         text-shadow: 4px 4px #000;
         z-index: 2000;
         pointer-events: none;
      }

      .fade-out {
         opacity: 0;
         transition: opacity 0.5s;
      }

      #start-btn {
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         font-size: 3rem;
         padding: 2rem 1rem;
         border-radius: 8px;
         background-color: #5716cfa9;
         color: white;
         border: none;
         cursor: pointer;
      }

      #loader {
         font-size: 2rem;
      }

      #start-btn:hover {
         background-color: #9416cfa9;
      }
   </style>
</head>

<body>
   <div id="loading-screen">
      <div id="loader">Carregando...</div>
      <button id="start-btn" style="display:none;">CLIQUE PARA INICIAR</button>
   </div>

   <div id="countdown" style="display:none;"></div>
   <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
   <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
   <script type="importmap">
         {"imports": {"three": "../build/three.module.js"}} 
   </script>

   <div id="container"></div>
   <div id="webgl-output">
      <script type="module" src="./main.js"></script>
   </div>

</body>

</html>
